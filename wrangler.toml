# Replace these placeholders before deploying.
name = "r2-webdav"
main = "src/worker.js"
compatibility_date = "2026-08-21"
workers_dev = true

# Serve the management panel from the same Worker. Panel/API requests still run through
# the Worker first so the existing Basic Auth protects the UI and its API.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Create this R2 Standard bucket first, then update this value to its exact name.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "your-webdav-bucket"

# Do not put credentials in this file. Set the following Worker Secrets instead:
#   WEBDAV_USERNAME
#   WEBDAV_PASSWORD
