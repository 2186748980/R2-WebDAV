# Replace these placeholders before deploying.
name = "r2-webdav"
main = "src/worker.js"
compatibility_date = "2026-08-21"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker authenticates /panel paths itself, then serves the exact asset.
# html_handling "none" disables the implicit 308 canonicalization redirects
# (for example /panel/index.html -> /panel/) that previously caused an
# ERR_TOO_MANY_REDIRECTS loop together with the Worker's own redirect.
run_worker_first = ["/panel", "/panel/*"]
html_handling = "none"

# Create this R2 Standard bucket first, then update this value to its exact name.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "webdav-r2-2186748980"

# Do not put credentials in this file. Set the following Worker Secrets instead:
#   WEBDAV_USERNAME
#   WEBDAV_PASSWORD
